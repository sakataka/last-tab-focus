<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Project Notes</title>
  <style>
    :root { --accent: #3157d5; --soft: #e8eeff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f7fb; color: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(960px, calc(100% - 64px)); margin: auto; padding: 80px 0; }
    .eyebrow { color: var(--accent); font-size: 14px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0 18px; font-size: clamp(44px, 7vw, 80px); letter-spacing: -.045em; line-height: 1; }
    .lead { max-width: 620px; color: #526078; font-size: 22px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px; margin-top: 56px; }
    .card { min-height: 210px; padding: 30px; border: 1px solid #d8dfeb; border-radius: 18px; background: white; box-shadow: 0 16px 44px rgb(37 55 91 / 10%); }
    .card.accent { background: var(--accent); color: white; }
    .bar { width: 52px; height: 7px; margin-bottom: 26px; border-radius: 9px; background: var(--soft); }
    h2 { margin: 0 0 12px; font-size: 26px; }
    p { margin: 0; line-height: 1.65; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow" id="eyebrow">Workspace</div>
    <h1 id="title">Project Notes</h1>
    <p class="lead" id="lead">A quiet place to collect decisions, open questions, and the next small step.</p>
    <div class="grid"><section class="card accent"><div class="bar"></div><h2 id="card-title">Today</h2><p id="card-copy">Review the current draft, confirm the important details, and keep the scope focused.</p></section><section class="card"><div class="bar"></div><h2>Recent</h2><p>Notes stay concise so the useful context is easy to find again.</p></section></div>
  </main>
  <script>
    const pages = {
      notes: { title: 'Project Notes', eyebrow: 'Workspace', lead: 'A quiet place to collect decisions, open questions, and the next small step.', cardTitle: 'Today', cardCopy: 'Review the current draft, confirm the important details, and keep the scope focused.', accent: '#3157d5', soft: '#e8eeff' },
      reference: { title: 'Reference', eyebrow: 'Library', lead: 'Clear background material for the task at hand, organized without distractions.', cardTitle: 'Key point', cardCopy: 'The most useful reference is the one that answers the next question directly.', accent: '#0d7f68', soft: '#dcf5ee' },
      tasks: { title: 'Task List', eyebrow: 'Plan', lead: 'A short list of concrete actions, with enough context to keep the work moving.', cardTitle: 'In progress', cardCopy: 'Finish the current item, verify the result, then move to the next step.', accent: '#b54f2d', soft: '#fae9e2' }
    };
    const page = pages[new URLSearchParams(location.search).get('page')] || pages.notes;
    document.title = page.title;
    document.documentElement.style.setProperty('--accent', page.accent);
    document.documentElement.style.setProperty('--soft', page.soft);
    document.getElementById('title').textContent = page.title;
    document.getElementById('eyebrow').textContent = page.eyebrow;
    document.getElementById('lead').textContent = page.lead;
    document.getElementById('card-title').textContent = page.cardTitle;
    document.getElementById('card-copy').textContent = page.cardCopy;
  </script>
</body>
</html>
